{{ define "main" }}
<h1 class="title is-1" data-heading="{{ .Title }}">{{ .Title }}</h1>

{{ if .Summary }}<p>{{ .Summary }}</p>{{ end }}

<div class="fixed-grid has-1-cols-mobile has-2-cols-tablet has-3-cols-desktop has-3-cols-widescreen has-3-cols-fullhd">
    <div class="grid is-column-gap-6 is-row-gap-4">

        {{ range .Pages.ByPublishDate.Reverse }}
            {{ partial "card" . }}
        {{ end }}

    </div>
</div>
{{ end }}
