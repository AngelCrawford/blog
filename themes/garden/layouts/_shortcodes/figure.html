{{- /* Garden — overrides Hugo's embedded figure shortcode so that a
       `figure` call in content renders the house treatment (ui/figure)
       instead of Hugo's bare <figure> markup. No content uses the shortcode
       today — this exists so the FIRST use looks right instead of founding a
       second figure style.

       Page-bundle images get the standard 4:3 processing; absolute/external
       srcs pass through untouched. Supported params mirror the embedded
       shortcode where they map: src, alt, caption, title, link. */ -}}
{{- $src := .Get "src" -}}
{{- $img := .Page.Resources.GetMatch $src -}}
{{- $w := 480 }}{{ $h := 360 -}}
{{- with $img -}}
  {{- $processed := .Process "fill 480x360 webp" -}}
  {{- $src = $processed.RelPermalink -}}
{{- end -}}
{{ partial "ui/figure" (dict
    "src" $src
    "alt" (.Get "alt" | default (.Get "caption"))
    "caption" (.Get "caption")
    "title" (.Get "title")
    "href" (.Get "link")
    "width" $w "height" $h
    "bleed" true) }}
