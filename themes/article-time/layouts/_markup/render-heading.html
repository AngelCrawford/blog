{{ $id := .Attributes.id }}
{{ $level := .Level }}
<h{{ $level }} id="{{ $id }}">
  {{ .Text | safeHTML }}
  <a class="anchor-link" href="#{{ $id }}" title="anker" aria-hidden="true">
    <svg class="remix">
      <use href="{{ "fonts/remixicon/remixicon.symbol.svg" | relURL }}?t={{ $.Page.Site.Params.remixicon_version}}#links-line"></use>
    </svg>
  </a>
</h{{ $level }}>
