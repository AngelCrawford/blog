name: Tests

# Runs the build smoke suite (Node test runner + Hugo) and the Playwright e2e
# smoke suite on PRs targeting main.
#
# NOT triggered on push-to-main: direct commits to main are WIP — they don't
# reach production until a release tag is pushed, and the tag's deploy workflow
# (daily-rebuild.yml) re-runs the same suite as a hard deploy gate. Running
# tests on every push too would just duplicate that gate. PR-triggered runs
# still gate code review.

on:
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch / PR.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    name: Build Smoke (node --test + Hugo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Hugo
        # Pinned to SHA for supply-chain hardening (third-party action).
        # v3.0.0 — bump by editing both this line AND the e2e job below in lockstep.
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # v3.0.0
        with:
          hugo-version: "0.161.1"
          extended: true

      - name: Install npm dependencies
        run: npm ci

      - name: Run build smoke tests
        run: npm run test:build

  e2e:
    name: E2E (Playwright chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Hugo
        # SHA-pinned — keep in sync with the build-smoke job above.
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # v3.0.0
        with:
          hugo-version: "0.161.1"
          extended: true

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright (chromium + system deps)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
