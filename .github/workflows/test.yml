name: Tests

# Runs the build smoke suite (Node test runner + Hugo) and the Playwright e2e
# smoke suite on every push and PR. Both jobs should be marked required for
# branch protection on `main` (manual config, see PR description).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch / PR.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    name: Build Smoke (node --test + Hugo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Hugo
        # Pinned to SHA for supply-chain hardening (third-party action).
        # v3.0.0 — bump by editing both this line AND the e2e job below in lockstep.
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # v3.0.0
        with:
          hugo-version: "0.161.1"
          extended: true

      # Hugo's `transpiler: "dartsass"` (used in layouts/_partials/_base/head.html)
      # requires the Dart Sass binary in PATH. Mirrors the daily-rebuild workflow.
      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Install npm dependencies
        run: npm ci

      - name: Run build smoke tests
        run: npm run test:build

  e2e:
    name: E2E (Playwright chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Hugo
        # SHA-pinned — keep in sync with the build-smoke job above.
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # v3.0.0
        with:
          hugo-version: "0.161.1"
          extended: true

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright (chromium + system deps)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
