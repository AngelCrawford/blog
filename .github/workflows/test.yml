name: Tests

# Runs the build smoke suite (Node test runner + Hugo) and the Playwright e2e
# smoke suite on PRs targeting main.
#
# NOT triggered on push-to-main: direct commits to main are WIP — they don't
# reach production until a release tag is pushed, and the tag's deploy workflow
# (daily-rebuild.yml) re-runs the same suite as a hard deploy gate. Running
# tests on every push too would just duplicate that gate. PR-triggered runs
# still gate code review.

on:
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch / PR.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    name: Build Smoke (node --test + Hugo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Hugo
        # Pinned to SHA for supply-chain hardening (third-party action).
        # v3.0.0 — bump by editing both this line AND the e2e job below in lockstep.
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.161.1"
          extended: true

      - name: Install npm dependencies
        run: npm ci

      - name: Run build smoke tests
        run: npm run test:build

  e2e:
    name: E2E (Playwright chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Hugo
        # SHA-pinned — keep in sync with the build-smoke job above.
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.161.1"
          extended: true

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright (chromium + system deps)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
