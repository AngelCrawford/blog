name: Daily Rebuild with Engagement Data

# REVIEW BEFORE Story 3.4 (data-updates branch automation):
# - Phase 0: schedule active, deploys with placeholder data (echo '{}')
# - Phase 1A: real fetch scripts arrive in Story 3.1, 3.2, 3.3
# - Verify schedule + data flow before relying on it in production

on:
  schedule:
    - cron: "0 2 * * *" # 2 AM UTC daily — rebuilds the LATEST TAG with fresh engagement data
  workflow_dispatch:    # Manual trigger; pick a ref to deploy
    inputs:
      ref:
        description: "Ref to deploy (branch, tag, or SHA)"
        default: "main"
        required: false
  push:
    tags:
      - "v*"            # Tag-triggered release deploy

# Permissions for the workflow
# - contents: write   → push to data-updates branch
# - pages: write      → deploy to GitHub Pages
# - id-token: write   → OIDC token used by actions/deploy-pages
# - issues: write     → create on-failure issue (Story 2.6 AC #6)
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

# Allow only one concurrent Pages deployment.
# Queued runs after the one in progress will not be cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-rebuild:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Ref selection per trigger:
      #   - workflow_dispatch: inputs.ref (default 'main', user can pick any branch/tag/SHA)
      #   - push (tag): refs/tags/v*  (the tag itself)
      #   - schedule: refs/heads/main  (then overridden to latest tag below)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0  # full history for git describe + worktree

      # Cron rebuilds the LATEST TAGGED commit, not main HEAD.
      # Code changes only reach production via a tagged release; the daily cron
      # just refreshes the latest release with fresh engagement data.
      - name: Checkout latest tag (cron only)
        if: github.event_name == 'schedule'
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LATEST" ]; then
            git checkout "$LATEST"
            echo "Cron rebuild from tag: $LATEST"
          else
            echo "::warning::No tags found — cron rebuild from main HEAD"
          fi

      # Detect maintenance mode via sentinel file at the repo root.
      # Toggle ON:  `touch .maintenance && git add -f .maintenance && git commit && git push`
      # Toggle OFF: `git rm .maintenance && git commit && git push`
      # When active, hugo loads config/maintenance/{config,params}.yaml on top of
      # _default — disabling RSS/sitemap/taxonomy and flipping maintenance_mode to true.
      #
      # Runs early (after the cron-tag-checkout) so downstream steps can gate
      # themselves on maintenance mode — the test gate, Playwright install, data
      # generation, and data commit are all skipped when `.maintenance` is present
      # so emergency maintenance flips finish in ~60s instead of ~150s.
      - name: Detect maintenance mode
        id: maint
        run: |
          if [ -f .maintenance ]; then
            echo "env=maintenance" >> "$GITHUB_OUTPUT"
            echo "::notice title=Maintenance mode active::Sentinel file '.maintenance' present — skipping tests + data generation, building with --environment maintenance"
          else
            echo "env=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Hugo
        # Pinned to SHA for supply-chain hardening (third-party action). Bump by
        # updating both the SHA and the trailing tag comment together.
        uses: peaceiris/actions-hugo@16361eb4acea8698b220b76c0d4e84e1fd22c61d # v2.6.0
        with:
          hugo-version: "0.161.1"
          extended: true

      # Hugo's `transpiler: "dartsass"` (used in layouts/_partials/_base/head.html)
      # requires the Dart Sass binary in PATH. peaceiris/actions-hugo doesn't
      # install it automatically.
      # `npm ci` (not `npm install`) so the resolved tree matches package-lock
      # exactly — matters now that Tailwind pulls platform-specific native
      # binaries (@tailwindcss/oxide-*) as optional dependencies. Also fails
      # loudly on lockfile drift instead of silently resolving something else.
      - name: Install dependencies
        run: npm ci

      # === Test gate ===
      # Tests must pass before any deploy step runs. If tests fail (build-smoke
      # regressions or e2e smoke broken), the workflow exits here and no deploy
      # happens — the previously deployed site stays live and untouched.
      # Skipped in maintenance mode: the previously-deployed site already has
      # a problem, the whole point is to put the maintenance page up NOW. The
      # maintenance template is hand-curated and tiny — accepted trade-off.
      - name: Install Playwright browsers
        if: steps.maint.outputs.env != 'maintenance'
        run: npx playwright install --with-deps chromium

      - name: Run tests (build-smoke + e2e)
        if: steps.maint.outputs.env != 'maintenance'
        run: npm test

      # === Generate data files via Phase-0-Placeholder-Scripts ===
      # Scripts run on main (where scripts/ exists) and write to main's data/ as
      # untracked files. Hugo build (later step) consumes them directly.
      # Phase 1A replaces the script bodies with real Umami/webmention.io fetch logic
      # (Stories 2.1, 2.3, 3.1, 3.2, 3.3).
      # Skipped in maintenance mode: maintenance.html doesn't read data files,
      # and an emergency flip shouldn't waste an Umami API call or commit
      # redundant data to the data-updates branch.
      - name: Generate data files via scripts
        if: steps.maint.outputs.env != 'maintenance'
        env:
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
        run: |
          mkdir -p data
          node scripts/fetch-umami-hearts.js
          # Phase 1A will replace this with: curl https://webmention.io/api/mentions.jf2?domain=...
          echo '{"children":[]}' > data/webmentions_raw.json
          node scripts/process-webmentions.js
          node scripts/calculate-popularity.js

      # === Commit data to data-updates branch via worktree ===
      # Why worktree instead of `git checkout data-updates`:
      #   - main checkout has scripts/ (needed to RUN the scripts above)
      #   - data-updates is an orphan branch with only data/ — no scripts/
      #   - Switching branches would lose scripts/ access
      # Worktree gives us a parallel checkout of data-updates without disturbing main.
      # Skipped in maintenance mode: no data was generated, no commit needed.
      - name: Commit data to data-updates branch
        if: steps.maint.outputs.env != 'maintenance'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git worktree add ../data-updates data-updates
          # Copy the freshly-generated data files into the worktree
          cp data/*.json ../data-updates/data/
          cd ../data-updates
          git add data/*.json
          # Commit returns non-zero if no changes — that's fine
          git commit -m "chore: update data $(date +%Y-%m-%d) [skip ci]" || echo "No changes to commit"
          git push origin data-updates
          cd "$GITHUB_WORKSPACE"
          git worktree remove ../data-updates

      # Setup Pages BEFORE build so we can pass the correct base_url to Hugo.
      # Output `base_url` reflects the active Pages URL:
      # - With custom domain configured: https://article-time.de/
      # - Without: https://angelcrawford.github.io/blog/
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Generate version string for the footer (passed via HUGO_PARAMS_VERSION env).
      # Footer reads this via `site.Params.version` — clean replacement for the old
      # `version.txt` + `readFile` pattern (no on-disk artefact).
      # Output:
      #   - exact tag if HEAD is at a tag         → e.g. "v0.1.0"
      #   - "<tag>+<commits-past>" otherwise      → e.g. "v0.1.0+3"
      #   - "dev" if no tags exist yet
      - name: Generate version string
        id: version
        run: |
          if EXACT=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            VERSION="$EXACT"
          elif LATEST=$(git describe --tags --abbrev=0 2>/dev/null); then
            COUNT=$(git rev-list "$LATEST"..HEAD --count)
            VERSION="${LATEST}+${COUNT}"
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Build version: $VERSION"

      - name: Build Hugo site
        env:
          HUGO_PARAMS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          hugo \
            --environment ${{ steps.maint.outputs.env }} \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Story 2.6 AC #6 — Layer 2 (workflow-enforced) failure notification.
      # Layer 1 (built-in failed-workflow email) depends on the repo owner's
      # personal Notifications setting, which is not auditable from the workflow
      # file. This step creates a GitHub Issue on any prior-step failure so the
      # alert is also visible in the repo's Issues tab and triggers an email via
      # GitHub's standard issue-notification path (no SMTP secret needed).
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily rebuild failed on ${date}`,
              body: `The daily-rebuild workflow failed.\n\n- Triggered by: \`${context.eventName}\`\n- Ref: \`${context.ref}\`\n- Commit: \`${context.sha}\`\n- Run: ${runUrl}\n\nCheck the run logs and resolve before the next scheduled rebuild.`,
              labels: ['ci-failure', 'automated']
            });
