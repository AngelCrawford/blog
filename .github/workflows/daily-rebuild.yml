name: Daily Rebuild with Engagement Data

# REVIEW BEFORE Story 3.4 (data-updates branch automation):
# - Phase 0: schedule active, deploys with placeholder data (echo '{}')
# - Phase 1A: real fetch scripts arrive in Story 3.1, 3.2, 3.3
# - Verify schedule + data flow before relying on it in production

on:
  schedule:
    - cron: "0 2 * * *" # 2 AM UTC daily
  workflow_dispatch: # Manual trigger button

# Permissions for the workflow
# - contents: write   → push to data-updates branch
# - pages: write      → deploy to GitHub Pages
# - id-token: write   → OIDC token used by actions/deploy-pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment.
# Queued runs after the one in progress will not be cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-rebuild:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # Full history (needed for branch switching)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.161.1"
          extended: true

      # Hugo's `transpiler: "dartsass"` (used in layouts/_partials/_base/head.html)
      # requires the Dart Sass binary in PATH. peaceiris/actions-hugo doesn't
      # install it automatically.
      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Install dependencies
        run: npm install

      # === Switch to data-updates BEFORE writing data files ===
      # Reason: data-updates already tracks data/popularity_scores.json (placeholder
      # from Task 1.3). Writing to main first then `git checkout data-updates` would
      # fail with "untracked working tree files would be overwritten by checkout".
      - name: Switch to data-updates branch
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout data-updates

      - name: Fetch Umami hearts (placeholder)
        env:
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
        run: |
          mkdir -p data
          echo '{}' > data/umami_hearts.json
          # TODO: Replace with scripts/fetch-umami-hearts.js in Phase 1A (Story 3.1)

      - name: Fetch webmentions (placeholder)
        run: |
          echo '{"children":[]}' > data/webmentions_raw.json
          # TODO: Replace with webmention.io fetch in Phase 1A (Story 3.2)

      - name: Calculate popularity scores (placeholder)
        run: |
          echo '{}' > data/popularity_scores.json
          # TODO: Replace with scripts/calculate-popularity.js in Phase 1A (Story 3.3)

      - name: Commit and push data-updates
        run: |
          git add data/*.json
          # Commit returns non-zero if no changes — that's fine
          git commit -m "chore: update data $(date +%Y-%m-%d) [skip ci]" || echo "No changes to commit"
          git push origin data-updates

      - name: Switch back to main
        run: git checkout main

      - name: Copy data from data-updates branch into main workspace
        run: |
          git fetch origin data-updates
          git checkout origin/data-updates -- data/
          # Main workspace now has latest data files (staged but not committed —
          # discarded after the build job finishes)

      - name: Build Hugo site
        run: hugo --environment production --minify

      # === Deploy to GitHub Pages via official Pages actions ===
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
