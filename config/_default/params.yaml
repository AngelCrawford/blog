# Maintenance mode — `maintenance_mode: false` here is the production fallback.
# To activate maintenance: create a `.maintenance` sentinel file at the repo
# root and push. The daily-rebuild workflow detects the file and builds with
# `--environment maintenance`, which loads config/maintenance/{config,params}.yaml
# (sets `disableKinds` for RSS/sitemap/etc, overrides `maintenance_mode: true`).
# layouts/baseof.html reads the flag and renders _base/maintenance partial.
# Static-site limitation: response stays HTTP 200 OK (GitHub Pages cannot 503).
# Edit copy below — it inherits into the maintenance environment.
# See docs/technical/runbook.md for full operating instructions.
maintenance_mode: false
maintenance:
    title: "Wartung läuft"
    message: "Bin gleich wieder da."
    expected_back: "" # optional, e.g. "Voraussichtlich zurück am 9. Mai um 18 Uhr"

# Site-owner identity — canonical single source consumed by SEO (Schema.org
# Person, OG article:author), footer copyright, h-card on the home page,
# Author-Box, and any partial that needs author metadata. See ADR
# `docs/decisions/adr-multi-author-to-coauthor.md` (Accepted 2026-05-12).
identity:
    name: "Angel Crawford"
    photo: "/images/identity/angel.webp" # final asset; swap path here when Story 9.14 lands the brand-cutover avatar
    url: "" # empty → Hugo resolves to baseURL; set explicitly only for off-site canonical identity
    about_url: "/pages/ueber-mich/" # footer h-card "Über mich" button links here; profile-page = layouts/page/profile.html
    note: "Web Entwickler. Sonnenliebhaber. Goth." # short bio — h-card p-note + sidebar tagline
    # `footer: true` surfaces the entry in the footer h-card (the IndieWeb-relevant
    # rel=me silos). Entries without the flag appear only on the /pages/ueber-mich/
    # profile page. RSS lives separately in `follow` below.
    # `color` = brand colour used on the profile page (svg fill); `opacity` optional.
    socials:
