remixicon_version: 2605081942
reading_speed: 179

# Maintenance mode — when true, every HTML page renders a static "Wartung läuft"
# screen instead of the real site. Toggle by setting `maintenance_mode: true`,
# committing, and pushing — GitHub Actions deploys automatically. Static-site
# limitation: response stays HTTP 200 OK (no 503). RSS / sitemap.xml are not
# affected. Consumed by layouts/baseof.html → _base/maintenance partial.
maintenance_mode: false
maintenance:
  title: "Wartung läuft"
  message: "Bin gleich wieder da."
  expected_back: "" # optional, e.g. "Voraussichtlich zurück am 9. Mai um 18 Uhr"

# Author identity — consumed by SEO (Schema.org Person, OG article:author),
# footer copyright, and any partial that needs author metadata.
default_author: "angel" # taxonomy slug (legacy, used by .GetTerms "authors")
default_author_name: "Angel Crawford" # legacy alias — kept for backward compatibility
author:
  name: "Angel Crawford"
  url: "https://article-time.de"
  # email: ""  # uncomment + fill if you want it exposed in metadata

# Content Security Policy — consumed by layouts/_partials/_base/head.html:14
# Each list is space-delimited into a CSP directive value.
# WARNING: only loosen these (add hosts) when you actually integrate that service.
# Stricter is better — every entry is a hole in the policy.
csp:
  default: ["'self'"]
  formaction: ["'self'"]
  framesrc: ["'self'", "https://www.youtube-nocookie.com"]
  frameancestors: ["'none'"] # Modern X-Frame-Options replacement — Clickjacking-Schutz, niemand darf die Site embedden
  imgsrc: ["'self'", "data:", "https:"]
  objectsrc: ["'none'"]
  stylesrc: ["'self'", "'unsafe-inline'"] # 'unsafe-inline' required for inline SVG style attrs (sea-filter, fill colors)
  scriptsrc: ["'self'", "https://cloud.umami.is"] # umami integrated in Phase 1A (Story 2.1)
  # script-src-elem dropped — `script-src` is the canonical fallback for both element and attr.
  # Removing the redundant directive silences Firefox's informational warning about
  # `'unsafe-eval'`/`'wasm-unsafe-eval'` being ignored in element-context.
  connectsrc: ["'self'", "https://cloud.umami.is", "https://api-gateway.umami.dev", "https://webmention.io"] # api-gateway.umami.dev is where the cloud.umami.is script POSTs pageview events (split infra; verified via CSP-violation 2026-05-09)

# Umami Cloud anonymous analytics — consumed by layouts/_partials/_base/head.html (Story 2.1).
# website_id is the public Umami Cloud UUID (rendered into every page's data-website-id attribute);
# it is NOT a secret. The UMAMI_API_KEY GitHub Secret is unrelated and used only by Story 3.1's
# server-side daily fetch.
# TODO(Story 2.5): privacy policy needs an Umami section before this hits production.
umami:
  website_id: "d3ec2957-2769-4bff-a89d-8a3211336121"
  script_url: "https://cloud.umami.is/script.js"

follow:
  header:
    - name: "RSS Feed"
      src: "index.xml"
      icon: "rss-line"
  footer:
    - name: "RSS Feed"
      src: "index.xml"
      icon: "rss-line"
