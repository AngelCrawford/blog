# Theme composition. Hugo resolves left to right — the first theme that defines
# a file wins, later ones fill the gaps, and the project root overrides both.
# `garden` holds the Tailwind design system and takes over component by
# component; `article-time` keeps serving everything not migrated yet.
theme: ["garden"]

# Tailwind live reload — Hugo's own mechanism, per the css.TailwindCSS docs.
#
# The problem it solves: Tailwind's dependency on the templates lives inside the
# CLI (`@source` in themes/garden/assets/css/main.css), so Hugo cannot see it.
# Editing a class in a template leaves main.css untouched, the stylesheet is not
# regenerated, and `hugo server` keeps serving CSS without the new utility —
# silently, which is the worst kind of failure.
#
# The three pieces work together:
#   buildStats     writes hugo_stats.json on every build, listing every class,
#                  id and tag the templates actually emitted
#   mounts         puts that file under assets/watching/, which is Hugo's
#                  convention for "watch this and rebuild what depends on it"
#   cachebusters   expires the cached `css` transform whenever it changes
#
# NOTE: hugo_stats.json is NOT read by Tailwind here — `@source` deliberately
# points at the garden directories instead. Sourcing the stats file would drag
# in every Bulma class name the old theme still emits, and Tailwind would
# generate a utility for each collision (measured: 44 of them, overriding Bulma
# because this stylesheet loads second). The file serves only as a change signal.
#
# Use `hugo server --disableFastRender`: in fast-render mode a class that is not
# yet in hugo_stats.json does not surface until the server is restarted.
build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/watching/hugo_stats\.json'
      target: 'css'
    # Same blind spot, second cause: main.css `@import`s css/base.css and
    # css/components.css, and that dependency also lives inside the Tailwind
    # CLI. Hugo sees the file change but has no edge from it to main.css, so
    # without this the server keeps serving the stylesheet it built before.
    - source: 'assets/css/.*\.css'
      target: 'css'
module:
  mounts:
    - source: "hugo_stats.json"
      target: "assets/watching/hugo_stats.json"

defaultContentLanguage: de
languages:
  de:
    locale: de-DE
    label: Deutsch
    timeZone: Europe/Berlin
    weight: 1
enableGitInfo: true
frontmatter:
  lastmod: ["lastmod", ":git", "date"]

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      strikethrough: false
      extras:
        delete:
          enable: true
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true

pagination:
  disableAliases: true
  pagerSize: 6
  path: page

permalinks:
  # articles: "/:section/:year/:month/:slug/"
  # year: "/articles/:slug/"
  # month: "/articles/:slug/"

# Server configuration with caching headers
server:
  headers:
    # Cache static assets for 1 year (31536000 seconds)
    "/**/*.{css,js,woff,woff2,ttf,png,jpg,jpeg,gif,webp,svg,ico}":
      Cache-Control: "public, max-age=31536000, immutable"

    # Cache HTML for 1 hour (3600 seconds)
    "/**/*.html":
      Cache-Control: "public, max-age=3600"

    # Cache RSS and sitemap for 1 hour
    "/**/*.{xml,json}":
      Cache-Control: "public, max-age=3600"

    # Set security headers for all responses
    "/**":
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "DENY"
      X-XSS-Protection: "1; mode=block"
      Referrer-Policy: "strict-origin-when-cross-origin"
      Permissions-Policy: "camera=(), microphone=(), geolocation=(), interest-cohort=()"

imaging:
  quality: 75
  bgColor: "#ffffff"
  exif:
    disableDate: true
    disableLatLong: true

# Output configuration
outputs:
  home: ["HTML", "RSS", "JSON"]
  section: ["HTML"]
  taxonomy: ["HTML"]
  term: ["HTML"]
  page: ["HTML"]

related:
  threshold: 20
  includeNewer: true
  indices:
    - name: series
      weight: 3
    - name: categories
      weight: 2

sitemap:
  changefreq: weekly
  filename: sitemap.xml
  # Story 1.5: explicit baseline so non-withered pages emit <priority>0.8</priority>;
  # withered pages override to 0.3 in layouts/sitemap.xml.
  priority: 0.8
