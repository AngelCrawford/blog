# Hugo merges this on top of _default at build time (per
# https://gohugo.io/configuration/introduction/). Lists at the same key are
# REPLACED, not concatenated — so list ONLY env-specific params here.
#
# Currently empty: every value production needs is correctly defined in _default,
# including the canonical CSP (with cloud.umami.is + api-gateway.umami.dev for
# Umami's split-infra pageview reporting, plus webmention.io for Story 2.3).
#
# If a future story introduces a prod-only behaviour (e.g., a different baseURL,
# a prod-only CSP entry), add ONLY that key/value below — never duplicate values
# already in _default.
