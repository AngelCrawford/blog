<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;padding:0;width:1280px;height:854px;overflow:hidden}
body{display:grid;grid-template-columns:1fr 320px}
.mark{display:grid;place-items:center;background:var(--color-surface);padding:0 48px}
.mark span{font-family:var(--font-heading);font-weight:600;font-size:112px;line-height:1;letter-spacing:.03em;white-space:nowrap;
background:linear-gradient(to bottom,var(--color-accent) 32%,var(--color-accent-hover) 50%,var(--color-accent-muted) 80%);
background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip i{display:block}
</style></head>
<body>
<div class="mark"><span>Article Time</span></div>
<div class="strip">
<i style="background:var(--color-accent-hover)"></i>
<i style="background:var(--color-warning)"></i>
<i style="background:var(--color-accent)"></i>
<i style="background:var(--color-accent-muted)"></i>
</div>
</body></html>
