<!-- @dsCard group="Brand" viewport="700x150" name="Punktraster" subtitle="Die Grundtextur der Seite — jede Fläche liest sich dagegen" -->
<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Punktraster</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--color-surface-sunken);font-family:var(--font-body);color:var(--color-ink)}
.g{display:grid;gap:12px}.r{display:flex;gap:12px;flex-wrap:wrap}
.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-hairline);overflow:hidden;background:var(--color-surface-raised)}
.sw i{display:block;height:56px;border-bottom:1px solid var(--border-hairline)}
.sw b{display:block;padding:8px 10px 2px;font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--color-accent)}
.sw s{display:block;padding:0 10px 8px;text-decoration:none;font-size:11px;color:var(--color-ink-muted)}
code{font-size:12px;color:var(--color-accent)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-ink-muted)}
</style></head><body>
<div class="at-page" style="height:110px;border-radius:var(--radius-md);position:relative">
<div class="gd-panel" style="position:absolute;left:20px;top:20px;right:20px;bottom:20px;display:flex;align-items:center"><span style="font-size:12px;color:var(--color-ink-muted)">Panel auf Seitengrund — nie Panel auf Panel</span></div>
</div></body></html>
