<!-- @dsCard group="Colors" viewport="700x150" name="Wachstumsstufen" subtitle="Nur Icon-Tönungen — nie Fläche, nie Textfarbe" -->
<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Wachstumsstufen</title>
<link rel="stylesheet" href="../styles.css"><script src="../assets/icons/inline-sprite.js"></script>
<style>body{margin:0;padding:18px;background:var(--color-surface-sunken);font-family:var(--font-body);color:var(--color-ink)}
.g{display:grid;gap:12px}.r{display:flex;gap:12px;flex-wrap:wrap}
.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-hairline);overflow:hidden;background:var(--color-surface-raised)}
.sw i{display:block;height:56px;border-bottom:1px solid var(--border-hairline)}
.sw b{display:block;padding:8px 10px 2px;font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--color-accent)}
.sw s{display:block;padding:0 10px 8px;text-decoration:none;font-size:11px;color:var(--color-ink-muted)}
code{font-size:12px;color:var(--color-accent)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-ink-muted)}
</style></head><body><ul style="display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none">
<li style="display:inline-flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border-hairline-quiet);border-radius:var(--radius-sm);background:var(--color-surface)">
<span class="gd-icon-duo gd-icon-duo-tinted" style="font-size:28px;color:var(--color-seedling)">
<svg viewBox="0 0 24 24"><use href="#seedling-fill"></use></svg>
<svg viewBox="0 0 24 24"><use href="#seedling-line"></use></svg></span>
<span><b style="display:block;font-weight:400;font-size:13px;color:var(--color-ink)">Seedling</b><s style="text-decoration:none;font-size:11px;color:var(--color-ink-muted)">Keimling — frisch, unfertig</s></span></li>
<li style="display:inline-flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border-hairline-quiet);border-radius:var(--radius-sm);background:var(--color-surface)">
<span class="gd-icon-duo gd-icon-duo-tinted" style="font-size:28px;color:var(--color-budding)">
<svg viewBox="0 0 24 24"><use href="#flower-fill"></use></svg>
<svg viewBox="0 0 24 24"><use href="#flower-line"></use></svg></span>
<span><b style="display:block;font-weight:400;font-size:13px;color:var(--color-ink)">Budding</b><s style="text-decoration:none;font-size:11px;color:var(--color-ink-muted)">Knospend — in Entwicklung</s></span></li>
<li style="display:inline-flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border-hairline-quiet);border-radius:var(--radius-sm);background:var(--color-surface)">
<span class="gd-icon-duo gd-icon-duo-tinted" style="font-size:28px;color:var(--color-evergreen)">
<svg viewBox="0 0 24 24"><use href="#tree-fill"></use></svg>
<svg viewBox="0 0 24 24"><use href="#tree-line"></use></svg></span>
<span><b style="display:block;font-weight:400;font-size:13px;color:var(--color-ink)">Evergreen</b><s style="text-decoration:none;font-size:11px;color:var(--color-ink-muted)">Immergrün — ausgereift</s></span></li>
<li style="display:inline-flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border-hairline-quiet);border-radius:var(--radius-sm);background:var(--color-surface)">
<span class="gd-icon-duo gd-icon-duo-tinted" style="font-size:28px;color:var(--color-withered)">
<svg viewBox="0 0 24 24"><use href="#skull-2-fill"></use></svg>
<svg viewBox="0 0 24 24"><use href="#skull-2-line"></use></svg></span>
<span><b style="display:block;font-weight:400;font-size:13px;color:var(--color-ink)">Withered</b><s style="text-decoration:none;font-size:11px;color:var(--color-ink-muted)">Verwelkt — veraltet</s></span></li>
</ul></body></html>
