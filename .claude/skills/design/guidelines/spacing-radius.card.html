<!-- @dsCard group="Spacing" viewport="700x150" name="Radien" subtitle="Drei Stufen — eine vierte lädt nur zur Diskussion ein" -->
<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Radien</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--color-surface-sunken);font-family:var(--font-body);color:var(--color-ink)}
.g{display:grid;gap:12px}.r{display:flex;gap:12px;flex-wrap:wrap}
.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-hairline);overflow:hidden;background:var(--color-surface-raised)}
.sw i{display:block;height:56px;border-bottom:1px solid var(--border-hairline)}
.sw b{display:block;padding:8px 10px 2px;font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--color-accent)}
.sw s{display:block;padding:0 10px 8px;text-decoration:none;font-size:11px;color:var(--color-ink-muted)}
code{font-size:12px;color:var(--color-accent)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-ink-muted)}
</style></head><body><div class="r">
<div style="display:flex;align-items:center;gap:12px"><span style="width:48px;height:48px;flex:none;border-radius:var(--radius-sm);border:1px solid var(--color-accent-muted);background:var(--color-surface)"></span><span><code>--radius-sm</code><s style="display:block;text-decoration:none;font-size:11px;color:var(--color-ink-muted)">4 px · Buttons, Felder, Badges</s></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:48px;height:48px;flex:none;border-radius:var(--radius-md);border:1px solid var(--color-accent-muted);background:var(--color-surface)"></span><span><code>--radius-md</code><s style="display:block;text-decoration:none;font-size:11px;color:var(--color-ink-muted)">8 px · Karten, Panels</s></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:48px;height:48px;flex:none;border-radius:var(--radius-lg);border:1px solid var(--color-accent-muted);background:var(--color-surface)"></span><span><code>--radius-lg</code><s style="display:block;text-decoration:none;font-size:11px;color:var(--color-ink-muted)">12 px · Dialoge, Overlays, Artikelbilder</s></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:48px;height:48px;flex:none;border-radius:var(--radius-tile);border:1px solid var(--color-accent-muted);background:var(--color-surface)"></span><span><code>--radius-tile</code><s style="display:block;text-decoration:none;font-size:11px;color:var(--color-ink-muted)">7,2 px · Info-Tiles und Sidebar-Widgets</s></span></div>
</div></body></html>
