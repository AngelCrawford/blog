<!-- @dsCard group="Spacing" viewport="700x180" name="Schatten" subtitle="Zurückhaltend — auf so dunklem Grund tragen Schatten kaum" -->
<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Schatten</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--color-surface-sunken);font-family:var(--font-body);color:var(--color-ink)}
.g{display:grid;gap:12px}.r{display:flex;gap:12px;flex-wrap:wrap}
.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-hairline);overflow:hidden;background:var(--color-surface-raised)}
.sw i{display:block;height:56px;border-bottom:1px solid var(--border-hairline)}
.sw b{display:block;padding:8px 10px 2px;font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--color-accent)}
.sw s{display:block;padding:0 10px 8px;text-decoration:none;font-size:11px;color:var(--color-ink-muted)}
code{font-size:12px;color:var(--color-accent)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-ink-muted)}
</style></head><body><div class="r" style="gap:28px;padding:8px 0 20px">
<div style="display:flex;align-items:center;gap:12px"><span style="width:48px;height:48px;flex:none;border-radius:var(--radius-md);background:var(--color-surface);box-shadow:var(--shadow-sm)"></span><span><code>--shadow-sm</code><s style="display:block;text-decoration:none;font-size:11px;color:var(--color-ink-muted)">Kaum abheben — Badges, Chips</s></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:48px;height:48px;flex:none;border-radius:var(--radius-md);background:var(--color-surface);box-shadow:var(--shadow-md)"></span><span><code>--shadow-md</code><s style="display:block;text-decoration:none;font-size:11px;color:var(--color-ink-muted)">Karten, Panels</s></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:48px;height:48px;flex:none;border-radius:var(--radius-md);background:var(--color-surface);box-shadow:var(--shadow-lg)"></span><span><code>--shadow-lg</code><s style="display:block;text-decoration:none;font-size:11px;color:var(--color-ink-muted)">Overlays, Suchergebnisse</s></span></div>
</div>
<p style="margin:0;max-width:64ch;font-size:12px;color:var(--color-ink-muted)">Trennung tragen vor allem Flächenkontrast und eine goldene Haarlinie. Die Schatten sind Unterstützung, nicht Struktur.</p>
</body></html>
