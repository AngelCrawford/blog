<!-- @dsCard group="Components" viewport="1100x640" name="Navigation" subtitle="Trennband unter dem Header, klebend, mit Vollbild-Drawer auf dem Handy" -->
<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/icons/inline-sprite.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:0 0 24px;background:var(--color-surface-sunken);font-family:var(--font-body)}
.cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-ink-muted);margin:0}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const MENU=[{label:'Artikel',href:'#',icon:'article-line'},{label:'Notizen',href:'#',icon:'lightbulb-line'},{label:'Rubriken',href:'#',icon:'pushpin-line'},{label:'Tags',href:'#',icon:'price-tag-3-line'},{label:'Archiv',href:'#',icon:'bookmark-line'}];
const FOLLOW=[{name:'RSS Feed',href:'#',icon:'rss-line'}];

const { SiteHeader, SiteNav, Icon } = window.ArticleTimeDesignSystem_de8a72;
function Card(){
  const [q,setQ]=React.useState('');
  const [active,setActive]=React.useState('Artikel');
  const rows=(
    <ul style={{listStyle:'none',margin:0,padding:0,display:'grid',gap:'var(--spacing-3)'}}>
      {['Warum Hugo','Bulma raus, Tailwind rein','Die Diagnose'].map(t=>(
        <li key={t}><a href="#" style={{display:'flex',alignItems:'center',gap:'var(--spacing-3)',padding:'var(--spacing-2) var(--spacing-3)',borderRadius:'var(--radius-sm)',border:'1px solid var(--border-hairline-quiet)'}}>
          <Icon name="article-line" size="1.25rem"/><span style={{flex:1,color:'var(--color-ink)'}}>{t}</span>
          <span style={{fontSize:'var(--text-sm)',color:'var(--color-ink-muted)'}}>06.08.26</span></a></li>
      ))}
    </ul>);
  return (<>
    <SiteHeader title="Article Time" sky="dusk" height={200}/>
    <SiteNav items={MENU} active={active} logo="../../assets/images/favicon/favicon-96x96.png" follow={FOLLOW}
      query={q} onQuery={setQ} results={rows} onNavigate={(it)=>setActive(it.label)}/>
    <div className="at-page" style={{padding:'var(--spacing-gutter)'}}>
      <p className="cap">Klebendes Trennband: gedämpfte Fläche, goldene Linie die nach rechts ausläuft. Aktiver Punkt gold mit auslaufender Unterstreichung. Klick wechselt, Suche öffnet das Panel an der rechten Kante.</p>
    </div>
    <div style={{display:'flex',gap:24,alignItems:'flex-start',padding:'var(--spacing-gutter)'}}>
      <div>
        <p className="cap" style={{marginBottom:8}}>Handy · Drawer offen</p>
        <iframe src="nav-mobile.html" title="Navigation auf dem Handy" width="390" height="420"
          style={{border:'1px solid var(--border-hairline)',borderRadius:'var(--radius-md)',background:'var(--color-surface-sunken)'}}></iframe>
      </div>
      <p style={{flex:1,minWidth:'18rem',margin:0,fontSize:12,lineHeight:1.6,color:'var(--color-ink-muted)'}}>
        Unter 768 px wandern die Punkte in einen Vollbild-Drawer statt zu schrumpfen: Überschriftenschrift auf 22 px,
        44 px hohe Zeilen, je eine auslaufende Goldlinie dazwischen, Suche oben, Folgen-Icons unten. Deckend, nicht
        durchscheinend — das System hat keine Weichzeichner über Inhalt, und ein durchscheinendes Menü über dem
        Punktraster ist unlesbar. Das Scrollen der Seite ist gesperrt, solange er offen ist.
      </p>
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script></body></html>
